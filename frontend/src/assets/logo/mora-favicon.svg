<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="MORA">
  <!-- Mora Gate — Favicon 32×32.
       Fond Encre avec rayon 6 (conteneur carré, jamais circulaire — le brand system
       interdit le conteneur circulaire) : le logomark reste lisible sur un onglet
       clair comme sur un onglet sombre. Marque centrée, 4 u de marge sur chaque côté. -->
  <rect width="32" height="32" rx="6" fill="#0B0C0E" />
  <g transform="translate(4, 4)">
    <path class="mora-gate-body" fill-rule="evenodd" d="M0 0H20V3H16V9.5L10.2 18H6.5L4 14.3V24H0V0ZM4 3V9.7L8.4 16H9.8L16 6.85V3H4Z" fill="#F9F9FB" />
    <rect class="mora-gate-leg" x="20" y="0" width="4" height="16" fill="#D96B27" />
  </g>
</svg>
